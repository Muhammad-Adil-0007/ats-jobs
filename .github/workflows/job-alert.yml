name: Daily job alert

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 08:00 in Germany (summer), 07:00 in winter
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed to commit seen_jobs.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run scraper
        id: scan
        run: |
          python ats_jobs.py > new_jobs.txt 2> scan.log
          cat scan.log
          cat new_jobs.txt
          if grep -q "NOTHING_TO_REPORT" new_jobs.txt; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Email new jobs
        if: steps.scan.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Job Alert <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Job alert: new / last 3 days / last 7 days"
          body: file://new_jobs.txt

      - name: Save seen-jobs state
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "update seen jobs [skip ci]"
          git push
